# =============================================
# TraVi-OTA - Application Profiles
# =============================================
spring.profiles.active=dev
spring.application.name=TraVi-OTA
server.port=8080

# =============================================
# Flyway (global fallback)
# Dung fallback de tranh truong hop profile config khong duoc nap dung.
# =============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
spring.flyway.encoding=UTF-8
spring.flyway.validate-migration-naming=${FLYWAY_VALIDATE_MIGRATION_NAMING:false}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.placeholders.json_type=JSONB
spring.flyway.placeholders.reserved_index_filter= WHERE trang_thai = 'RESERVED'
spring.flyway.placeholders.seed_default_loyalty_suffix=ON CONFLICT DO NOTHING

# =============================================
# JWT
# =============================================
SECRET_KEY=${JWT_SECRET_KEY}
JWT_EXPIRATION=${JWT_EXPIRATION_TIME}
GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID_ENV:}

# =============================================
# CORS Configuration
# =============================================
FRONTEND_URL=${FRONTEND_URL_ENV:http://localhost:5174}

# =============================================
# Weather
# =============================================
weather.open-meteo.base-url=${OPEN_METEO_BASE_URL:https://api.open-meteo.com}
# =============================================
# File Upload config for local storage
file.upload.dir=uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB

# =============================================
# Voucher Reserve/Release Configuration
# =============================================
voucher.reserve.timeout-seconds=1800
voucher.cleanup.interval-ms=300000
idempotency.key.ttl-hours=24
